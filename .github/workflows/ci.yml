name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  invariants:
    name: invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Negative tests for invariant checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Invariant checks on the repo
        run: python3 scripts/check_invariants.py

  swift-test:
    name: swift-test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build and test
        run: swift test
